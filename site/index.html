<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SAP AI Opportunity Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a process ribbon (L1 chain) on top, filters beneath, then L1 sections holding L2 opportunity rows (pain → AI). */
:root{
  --bg:#f6f6f4; --surface:#ffffff; --sunk:#ebebe6; --fg:#2e2e38; --muted:#5f5f6b; --line:#d9d9d3;
  --accent:#ffe600; --on-accent:#2e2e38; --ink:#2e2e38;
  --pain:#b4362f; --pain-bg:#fbeceb; --gain:#11734f; --gain-bg:#e8f4ee;
  --chip:#efefea;
  --f-display:"Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, "Noto Sans SC", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1a24; --surface:#23232f; --sunk:#2a2a36; --fg:#ececf0; --muted:#a3a3b0; --line:#3a3a47;
  --accent:#ffe600; --on-accent:#1a1a24; --ink:#ffe600;
  --pain:#f08a82; --pain-bg:#33201f; --gain:#5fd3a2; --gain-bg:#16291f; --chip:#2f2f3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1a24; --surface:#23232f; --sunk:#2a2a36; --fg:#ececf0; --muted:#a3a3b0; --line:#3a3a47;
  --accent:#ffe600; --on-accent:#1a1a24; --ink:#ffe600;
  --pain:#f08a82; --pain-bg:#33201f; --gain:#5fd3a2; --gain-bg:#16291f; --chip:#2f2f3b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;line-height:1.15;margin-top:6px;max-width:16em}
.lede{max-width:40em;color:var(--muted);margin:10px 0 0}
.lens{display:flex;gap:8px;flex-wrap:wrap}
.lens button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;text-align:left;min-width:220px;flex:1}
.lens button b{display:block;font-family:var(--f-display);font-size:18px}
.lens button span{font-size:13px;color:var(--muted)}
.lens button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 -4px 0 var(--accent), inset 0 0 0 1px var(--fg)}

.procs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.procs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600}
.procs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.procs small{font-weight:400;opacity:.8;margin-left:6px}

.ribbon{display:flex;overflow-x:auto;gap:0;margin:6px 0 18px;padding-bottom:4px}
.ribbon button{flex:1 0 140px;background:var(--surface);border:1px solid var(--line);border-left:none;padding:12px 22px 12px 26px;text-align:left;position:relative;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%)}
.ribbon button:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);border-left:1px solid var(--line);border-radius:8px 0 0 8px;padding-left:16px}
.ribbon button+button{margin-left:-8px}
.ribbon .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ribbon .nm{display:block;font-weight:600;font-size:14px;line-height:1.3}
.ribbon .ct{font-size:12px;color:var(--muted)}
.ribbon button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ribbon button[aria-pressed="true"] .code,.ribbon button[aria-pressed="true"] .ct{color:var(--on-accent);opacity:.8}

.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;background:var(--sunk);border-radius:10px;margin-bottom:22px}
.filters .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0;width:220px;max-width:100%;font:inherit;color:var(--fg)}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

section.l1{margin-bottom:30px}
.l1head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;border-bottom:3px solid var(--accent);padding-bottom:6px;margin-bottom:12px}
.l1head .code{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.l1head .share{font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:1px 8px;font-weight:600}
.l1head h2{font-size:22px;font-weight:700}
.l1head p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}

.l2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.2fr) minmax(0,1.35fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.l2>div{padding:14px 16px;min-width:0}
.l2 .who{border-right:1px solid var(--line)}
.l2 .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.l2 h3{font-size:16px;font-weight:700;margin:2px 0 8px;line-height:1.3}
.team{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:var(--chip);border-radius:6px;padding:3px 8px}
.team svg{flex:none}
.col-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;margin-bottom:4px;display:block;font-weight:500}
.pain{background:var(--pain-bg)}
.pain .col-h{color:var(--pain)}
.ai{background:var(--gain-bg)}
.ai .col-h{color:var(--gain)}
.l2 p{margin:0;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tag{font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:1px 7px}
.sapref{font-size:12px;color:var(--muted);margin-top:8px}
.sapref b{font-weight:600;color:var(--fg)}
.impact{display:inline-flex;gap:2px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:10px}
.impact i{width:14px;height:6px;border-radius:2px;background:var(--line);display:inline-block}
.impact i.on{background:var(--ink)}
.impact span{margin-left:6px}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}


.deliv{margin-top:10px}
.deliv .col-h{color:var(--muted)}
.deliv ul{margin:0;padding-left:1.1em;font-size:13px}
.deliv li{margin:1px 0}
.saving{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-top:10px;font-size:12px;color:var(--muted)}
.saving b{font-size:13px;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:1px 8px}
.sum-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.sum-toggle{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.sum-toggle:hover{border-color:var(--fg)}
#sum-body p{margin-top:10px}
#summary{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:6px 0 16px}
.sum-head h2{font-size:18px}
.sum-head p{margin:6px 0 12px;color:var(--muted);font-size:13.5px;max-width:60em}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:9em minmax(0,1fr) 3em 7.5em;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:4px 6px;border-radius:6px}
.bar:hover{background:var(--sunk)}
.bar[aria-pressed="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.bar .bn{font-size:13.5px;font-weight:600;min-width:0}
.bar .track{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-right:1px solid var(--ink)}
.bar .bv{font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.bar .bh{font-size:12px;color:var(--muted)}
.bar.ext{grid-template-columns:1.6em 3.2em 10em minmax(0,1fr) 2.2em minmax(0,16em)}
.bar .rk{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.bar .pc{font-family:var(--f-mono);font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:4px;text-align:center;padding:0 4px}
.bar.ext .bh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){.bar.ext{grid-template-columns:1.6em 3.2em minmax(0,1fr) 2.2em}.bar.ext .track{display:none}}
@media (max-width:600px){.bar{grid-template-columns:7em minmax(0,1fr) 3em}.bar .bh{display:none}}
footer{margin-top:40px;font-size:12.5px;color:var(--muted);max-width:60em}
@media (max-width:820px){
  .l2{grid-template-columns:1fr}
  .l2 .who{border-right:none;border-bottom:1px solid var(--line)}
  .count{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.l2{transition:border-color .15s}.l2:hover{border-color:var(--accent)}}
</style>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">AI Opportunity Map · SAP 项目</div>
      <h1>AI 在 SAP 项目中的价值落点</h1>
      <p class="lede">同一个项目，两个视角。“客户运营”看 AI 如何提升我们所实施财务流程的效率；“项目实施”从 EY 作为 SI 实施伙伴的角度，看 AI 能在哪些活动和交付物上降低实施成本。</p>
    </div>
    <div class="lens" role="group" aria-label="视角">
      <button id="lens-ext" aria-pressed="true" data-lens="ext"><b>客户运营（External）</b><span>S2P · O2C · R2R，按 L1 / L2 拆解</span></button>
      <button id="lens-int" aria-pressed="false" data-lens="int"><b>项目实施（Internal）</b><span>EY 作为 SI：各阶段交付物与 AI 降本点</span></button>
    </div>
  </header>

  <div id="summary" hidden></div>
  <div class="procs" id="procs" role="group" aria-label="流程"></div>
  <nav class="ribbon" id="ribbon" aria-label="L1 步骤"></nav>

  <div class="filters">
    <div class="grp"><span class="lbl">AI 类型</span><span id="types" class="grp"></span></div>
    <div class="grp"><span class="lbl" id="imp-lbl">价值</span>
      <button class="fchip" id="imp-all" aria-pressed="true" data-imp="0">全部</button>
      <button class="fchip" id="imp-hi" aria-pressed="false" data-imp="3">仅高价值</button>
    </div>
    <div class="grp"><input id="q" type="search" placeholder="搜索痛点、团队、AI…" aria-label="搜索"></div>
    <div class="count" id="count"></div>
  </div>

  <main id="out"></main>

  <footer>
    讨论稿。价值评级、节省潜力区间和各阶段工作量占比都是基于经验的示意假设，不是实测数据，需用 EY 项目实际数据校准。“SAP 现有能力”仅示例说明 SAP 产品组合中已有类似功能；对客户引用前请核实当前可用性、授权和版本。
  </footer>
</div>

<script>
/* ===== DATA =====
   每个 L2: [名称, 负责团队/角色, 痛点, AI 如何帮助, AI 类型, 价值 1-3, SAP 现有能力示例（无则留空）]
   AI 类型（保留英文作为筛选键）: Generative, Predictive, Document AI, Matching, Anomaly, Agentic */
const DATA = {
ext: {
 S2P: { name:"Source-to-Pay", blurb:"从采购策略到向供应商付款。", l1:[

   ["支出分析与品类策略","Category Management 品类管理","支出分散在多个 ERP 和公司卡中，分类不准确、不一致，品类计划依赖过时的 Excel 数据。","ML 自动将支出明细归类到统一分类体系；GenAI 用通俗语言总结品类趋势和降本机会。","Predictive",3,"SAP Ariba Spend Analysis"],
   ["供应商准入与资质审核","Supplier Management 供应商管理","问卷、证书和银行/税务文件靠人工核对，准入周期长达数周。","Document AI 读取证书和银行函件，对照工商/税务登记自动校验，在人工复核前先标出缺漏。","Document AI",2,"SAP Ariba Supplier Lifecycle & Performance"],

   ["合同起草与合规","采购 + 法务","义务和价格条款埋在 PDF 里，导致价格漏损和续约遗漏。","抽取合同条款，对照法务标准条款检查偏差；当 PO 或发票价格违反合同时自动提醒。","Document AI",3,"SAP Ariba Contracts"],

   ["PO 创建与货源确定","采购员 Buyer","采购员手工将 PR 转为 PO，凭经验选择货源。","根据合同和历史推荐货源和价格；对符合条件的行项目实现无人工 PR→PO。","Predictive",2,"S/4HANA purchasing (ML source proposals)"],
   ["订单确认与催货","采购员 Buyer","靠邮件追供应商确认，预计到货时间未在 SAP 中更新。","Agent 读取供应商邮件、录入订单确认，并预测哪些未清 PO 会延迟到货。","Agentic",2,""]
  ]},
  { name:"收货", desc:"确认货物和服务已交付。", l2:[

   ["服务确认","需求方","服务确认单（SES）常被遗忘，服务类发票卡住。","根据工时表或供应商报告自动起草服务确认，一键确认。","Generative",1,""]

  ]}
 ]},
 O2C: { name:"Order-to-Cash", blurb:"从客户准入到回款入账。", l1:[
  { name:"客户与信用管理", desc:"了解客户，确定可承受的风险。", l2:[
   ["客户准入与主数据","销售运营 / 主数据","客户主数据不完整、重复，导致开票和税务错误。","从工商登记自动填充，模糊匹配去重，录入时即校验税号。","Matching",2,"SAP Master Data Governance"],

  ]},
  { name:"订单管理", desc:"报价、接单和确认订单。", l2:[

   ["状态报告与 SteerCo","PMO / Project Manager",["周报","SteerCo 材料","RAID Log"],"每周花大量时间从各工作流收集状态、拼周报和 SteerCo PPT。","从 Cloud ALM / JIRA 自动汇总进度和 RAID，起草周报和 SteerCo 材料。","Generative",3,"PMO 工作量 ↓约 30%","SAP Cloud ALM"],
   ["范围与变更管理","Engagement Manager",["变更请求 CR 日志","CR 影响评估"],"变更影响评估慢，小变更常被默默吸收成免费工作。","对照设计和估算模型自动评估 CR 影响和工作量，确保变更被识别和计费。","Generative",2,"减少范围蔓延",""],
   ["交付物质量评审","Engagement QA Reviewer",["QA 评审报告"],"交付物质量评审靠人工抽查，覆盖有限。","按 EY 模板和标准自动检查交付物的完整性和一致性，评审人聚焦实质问题。","Generative",2,"30–40%",""],
   ["资源与成本跟踪","PMO / Engagement Manager",["资源计划","预算跟踪（ETC / EAC）"],"超支往往在月底对账时才发现，纠偏太晚。","基于工时和进度预测燃烧率和完工成本，提前预警超支风险。","Predictive",2,"降低超支风险",""]
  ]}
 ]}
}
};

/* ===== UI ===== */
const TYPES = ["Generative","Predictive","Document AI","Matching","Anomaly","Agentic"];
const LVL = {ext:["","较低","中等","高"], int:["","较低","中等","高"]};
const st = {lens:"ext", proc:"S2P", l1:-1, types:new Set(), imp:0, q:"", sumOpen:true};
try{ const s = JSON.parse(localStorage.getItem("sapai")||"{}"); if(s.lens && DATA[s.lens]) { st.lens=s.lens; st.proc=Object.keys(DATA[s.lens])[0]; if(s.proc && DATA[s.lens][s.proc]) st.proc=s.proc; } }catch(e){}
try{ if(localStorage.getItem("sapai_sum")==="0") st.sumOpen=false; }catch(e){}
const save=()=>{try{localStorage.setItem("sapai",JSON.stringify({lens:st.lens,proc:st.proc}));localStorage.setItem("sapai_sum",st.sumOpen?"1":"0")}catch(e){}};
// Summary panel: heading row with an expand / collapse toggle; bars only while expanded.
function sumPanel(title, desc, rows){
  $("summary").hidden=false;
  $("summary").innerHTML=`<div class="sum-head"><div class="sum-top"><h2>${title}</h2>
    <button class="sum-toggle" data-sum="1" aria-expanded="${st.sumOpen}" aria-controls="sum-body">${st.sumOpen?"收起图表":"展开图表"}<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="${st.sumOpen?"M2 8l4-4 4 4":"M2 4l4 4 4-4"}" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
    <div id="sum-body" ${st.sumOpen?"":"hidden"}><p>${desc}</p><div class="bars">${rows}</div></div></div>`;
}
function jumpToDetail(){
  const t=$("procs").hidden?$("ribbon"):$("procs");
  t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const personIcon='<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="currentColor"/><path d="M2 15c0-3.3 2.7-5 6-5s6 1.7 6 5" fill="currentColor"/></svg>';
const prefix = (lens,proc)=> lens==="ext"?proc:"ACT";

// External rows: [name, team, pain, ai, type, value, sap]
// Internal rows: [name, role, deliverables[], pain, ai, type, saving, savingRange, tools]
function row(r){
  return st.lens==="ext"
    ? {name:r[0], who:r[1], deliv:[], pain:r[2], ai:r[3], type:r[4], lvl:r[5], range:"", sap:r[6]}
    : {name:r[0], who:r[1], deliv:r[2], pain:r[3], ai:r[4], type:r[5], lvl:r[6], range:r[7], sap:r[8]};
}

function match(o){
  if(st.types.size && !st.types.has(o.type)) return false;
  if(o.lvl < st.imp) return false;
  if(st.q){ const q=st.q.toLowerCase(); if(![o.name,o.who,o.pain,o.ai,o.type,o.sap,o.range].concat(o.deliv).join(" ").toLowerCase().includes(q)) return false; }
  return true;
}

function summary(p){
  if(st.lens==="ext"){
    const PN={S2P:"S2P",O2C:"O2C",R2R:"R2R"};
    const items=[];
    for(const [k,v] of Object.entries(DATA.ext)) v.l1.forEach((l,i)=>{
      const all=l.l2.map(row), score=all.reduce((a,o)=>a+o.lvl,0), hi=all.filter(o=>o.lvl===3);
      items.push({k,i,name:l.name,score,n:all.length,hi});
    });
    items.sort((a,b)=>b.score-a.score || b.hi.length-a.hi.length);
    const max=items[0].score;
    const rows=items.map((t,r)=>`<button class="bar ext" data-sproc="${t.k}" data-l1="${t.i}" aria-pressed="${st.proc===t.k&&st.l1===t.i}">
      <span class="rk">${r+1}</span>
      <span class="pc">${PN[t.k]}</span>
      <span class="bn">${esc(t.name)}</span>
      <span class="track"><span class="fill" style="width:${t.score/max*100}%"></span></span>
      <span class="bv">${t.score}</span>
      <span class="bh" title="${esc(t.hi.map(o=>o.name).join("、"))}">${t.hi.length?`${t.hi.length} 个高价值：${esc(t.hi.map(o=>o.name).join("、"))}`:"暂无高价值项"}</span></button>`).join("");
    sumPanel("价值视角：机会集中在哪里", `S2P、O2C、R2R 全部 L1 按价值得分从高到低排列。得分是该 L1 下各 L2 价值评级（1–3）之和，反映机会的总量；右侧列出其中的高价值 L2。点击任一行可跳转到对应流程和 L1 查看详情。评级为定性判断，待结合客户数据校准。`, rows);
    return;
  }
  const rows = p.l1.map((l,i)=>{
    const all=l.l2.map(row), hi=all.filter(o=>o.lvl===3).length;
    return `<button class="bar" data-sproc="${st.proc}" data-l1="${i}" aria-pressed="${st.l1===i}">
      <span class="bn">${esc(l.name)}</span>
      <span class="track"><span class="fill" style="width:${l.share/45*100}%"></span></span>
      <span class="bv">${l.share}%</span>
      <span class="bh">${hi} 个高节省点</span></button>`}).join("");
  sumPanel("成本视角：工作量花在哪里", `各阶段占 SI 实施总工作量的示意比例（典型 S/4HANA 项目，按经验假设，待用 EY 项目实际数据校准）。Realize 和 Explore 合计约六成，是 AI 节省的主战场；Explore 阶段压缩 RICEFW 数量，会连带减少后面的开发、测试和运维成本。点击某一阶段可筛选。`, rows);
}

function render(){
  const lensData = DATA[st.lens], p = lensData[st.proc];
  for(const b of document.querySelectorAll(".lens button")) b.setAttribute("aria-pressed", b.dataset.lens===st.lens);
  $("procs").innerHTML = Object.entries(lensData).map(([k,v])=>{
    const n=v.l1.reduce((a,l)=>a+l.l2.length,0);
    return `<button data-proc="${k}" aria-pressed="${k===st.proc}">${esc(v.name)}<small>${n} 个 L2</small></button>`}).join("");
  $("procs").hidden = Object.keys(lensData).length<2;
  summary(p);
  const pre = prefix(st.lens, st.proc);
  $("ribbon").innerHTML = p.l1.map((l,i)=>{
    const n=l.l2.map(row).filter(match).length;
    return `<button data-l1="${i}" aria-pressed="${st.l1===i}" title="${esc(l.desc)}"><span class="code">${pre}-${i+1}</span><span class="nm">${esc(l.name)}</span><span class="ct">显示 ${n} / ${l.l2.length}</span></button>`}).join("");
  $("types").innerHTML = TYPES.map(t=>`<button class="fchip" data-type="${t}" aria-pressed="${st.types.has(t)}">${t}</button>`).join("");
  $("imp-lbl").textContent = st.lens==="ext" ? "价值" : "节省潜力";
  $("imp-hi").textContent = st.lens==="ext" ? "仅高价值" : "仅高节省";
  for(const b of document.querySelectorAll("[data-imp]")) b.setAttribute("aria-pressed", +b.dataset.imp===st.imp);
  const lvlWord = st.lens==="ext" ? "价值" : "节省潜力";
  let total=0, shown=0, html="";
  p.l1.forEach((l,i)=>{
    total+=l.l2.length;
    if(st.l1>=0 && st.l1!==i) return;
    const rows=l.l2.map((r,j)=>[row(r),j]).filter(([o])=>match(o));
    shown+=rows.length;
    if(!rows.length) return;
    html+=`<section class="l1" id="l1-${i}"><div class="l1head"><span class="code">${pre}-${i+1}</span><h2>${esc(l.name)}</h2>${l.share?`<span class="share">约占工作量 ${l.share}%</span>`:""}<p>${esc(l.desc)}</p></div>`;
    html+=rows.map(([o,j])=>`<article class="l2">
      <div class="who"><span class="code">${pre}-${i+1}.${j+1} · L2</span><h3>${esc(o.name)}</h3>
        <span class="team">${personIcon}${esc(o.who)}</span>
        ${o.deliv.length?`<div class="deliv"><span class="col-h">交付物</span><ul>${o.deliv.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`:""}
        <div class="meta"><span class="tag">${esc(o.type)}</span></div>
        <div class="impact" aria-label="${lvlWord} ${o.lvl} / 3">${[1,2,3].map(k=>`<i class="${k<=o.lvl?"on":""}"></i>`).join("")}<span>${LVL[st.lens][o.lvl]}${lvlWord}</span></div>
      </div>
      <div class="pain"><span class="col-h">痛点</span><p>${esc(o.pain)}</p></div>
      <div class="ai"><span class="col-h">AI 如何帮助</span><p>${esc(o.ai)}</p>
        ${o.range?`<div class="saving"><span>节省潜力（示意）</span><b>${esc(o.range)}</b></div>`:""}
        ${o.sap?`<div class="sapref">${st.lens==="ext"?"SAP 现有能力":"可用工具"}：<b>${esc(o.sap)}</b></div>`:""}</div>
    </article>`).join("");
    html+=`</section>`;
  });
  $("out").innerHTML = html || `<div class="empty">没有符合筛选条件的条目。请清除部分筛选或搜索词。</div>`;
  $("count").textContent = `显示 ${shown} / ${total} 个 L2 ${st.lens==="ext"?"流程":"活动"}`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.lens){ st.lens=b.dataset.lens; st.proc=Object.keys(DATA[st.lens])[0]; st.l1=-1; save(); }
  else if(b.dataset.sproc){ const same=st.proc===b.dataset.sproc && st.l1===+b.dataset.l1; st.proc=b.dataset.sproc; st.l1=same?-1:+b.dataset.l1; save(); render(); if(!same) jumpToDetail(); return; }
  else if(b.dataset.sum){ st.sumOpen=!st.sumOpen; save(); }
  else if(b.dataset.proc){ st.proc=b.dataset.proc; st.l1=-1; save(); }
  else if(b.dataset.l1!==undefined){ const i=+b.dataset.l1; st.l1 = st.l1===i?-1:i; }
  else if(b.dataset.type){ st.types.has(b.dataset.type)?st.types.delete(b.dataset.type):st.types.add(b.dataset.type); }
  else if(b.dataset.imp!==undefined){ st.imp=+b.dataset.imp; }
  else return;
  render();
});
$("q").addEventListener("input",e=>{st.q=e.target.value.trim(); render();});
render();
</script>

</body>
