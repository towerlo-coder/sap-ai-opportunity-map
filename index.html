<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAP AI Opportunity Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a process ribbon (L1 chain) on top, filters beneath, then L1 sections holding L2 opportunity rows (pain → AI). */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8ecee; --fg:#14202b; --muted:#5a6873; --line:#d5dce0;
  --s2p:#0f7a6c; --o2c:#3b4fc4; --r2r:#b0620c; --int:#7a3fa8;
  --pain:#b4362f; --pain-bg:#fbeceb; --gain:#11734f; --gain-bg:#e6f4ee;
  --chip:#eef1f3;
  --f-display:"Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, "Noto Sans SC", monospace;
  --accent:var(--s2p);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --sunk:#1d2933; --fg:#e4eaee; --muted:#93a2ad; --line:#2a3743;
  --s2p:#3fc2ae; --o2c:#8c9cff; --r2r:#f0a24a; --int:#c58cf0;
  --pain:#f08a82; --pain-bg:#2c1c1d; --gain:#5fd3a2; --gain-bg:#14281f; --chip:#22303b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --sunk:#1d2933; --fg:#e4eaee; --muted:#93a2ad; --line:#2a3743;
  --s2p:#3fc2ae; --o2c:#8c9cff; --r2r:#f0a24a; --int:#c58cf0;
  --pain:#f08a82; --pain-bg:#2c1c1d; --gain:#5fd3a2; --gain-bg:#14281f; --chip:#22303b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;line-height:1.15;margin-top:6px;max-width:16em}
.lede{max-width:40em;color:var(--muted);margin:10px 0 0}
.lens{display:flex;gap:8px;flex-wrap:wrap}
.lens button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;text-align:left;min-width:220px;flex:1}
.lens button b{display:block;font-family:var(--f-display);font-size:18px}
.lens button span{font-size:13px;color:var(--muted)}
.lens button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}

.procs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.procs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600}
.procs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.procs small{font-weight:400;opacity:.8;margin-left:6px}

.ribbon{display:flex;overflow-x:auto;gap:0;margin:6px 0 18px;padding-bottom:4px}
.ribbon button{flex:1 0 140px;background:var(--surface);border:1px solid var(--line);border-left:none;padding:12px 22px 12px 26px;text-align:left;position:relative;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%)}
.ribbon button:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);border-left:1px solid var(--line);border-radius:8px 0 0 8px;padding-left:16px}
.ribbon button+button{margin-left:-8px}
.ribbon .code{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.ribbon .nm{display:block;font-weight:600;font-size:14px;line-height:1.3}
.ribbon .ct{font-size:12px;color:var(--muted)}
.ribbon button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.ribbon button[aria-pressed="true"] .code,.ribbon button[aria-pressed="true"] .ct{color:var(--bg);opacity:.85}

.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;background:var(--sunk);border-radius:10px;margin-bottom:22px}
.filters .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0;width:220px;max-width:100%;font:inherit;color:var(--fg)}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

section.l1{margin-bottom:30px}
.l1head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:12px}
.l1head .code{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.l1head h2{font-size:22px;font-weight:700}
.l1head p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}

.l2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.2fr) minmax(0,1.35fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.l2>div{padding:14px 16px;min-width:0}
.l2 .who{border-right:1px solid var(--line)}
.l2 .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.l2 h3{font-size:16px;font-weight:700;margin:2px 0 8px;line-height:1.3}
.team{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:var(--chip);border-radius:6px;padding:3px 8px}
.team svg{flex:none}
.col-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;margin-bottom:4px;display:block;font-weight:500}
.pain{background:var(--pain-bg)}
.pain .col-h{color:var(--pain)}
.ai{background:var(--gain-bg)}
.ai .col-h{color:var(--gain)}
.l2 p{margin:0;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tag{font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:1px 7px}
.sapref{font-size:12px;color:var(--muted);margin-top:8px}
.sapref b{font-weight:600;color:var(--fg)}
.impact{display:inline-flex;gap:2px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:10px}
.impact i{width:14px;height:6px;border-radius:2px;background:var(--line);display:inline-block}
.impact i.on{background:var(--accent)}
.impact span{margin-left:6px}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}

footer{margin-top:40px;font-size:12.5px;color:var(--muted);max-width:60em}
@media (max-width:820px){
  .l2{grid-template-columns:1fr}
  .l2 .who{border-right:none;border-bottom:1px solid var(--line)}
  .count{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.l2{transition:border-color .15s}.l2:hover{border-color:var(--accent)}}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">AI Opportunity Map · SAP 项目</div>
      <h1>AI 在 SAP 项目中的价值落点</h1>
      <p class="lede">同一个项目，两个视角。“客户运营”看 AI 如何提升我们所实施财务流程的效率；“项目实施”看 AI 如何提升顾问的交付效率。</p>
    </div>
    <div class="lens" role="group" aria-label="视角">
      <button id="lens-ext" aria-pressed="true" data-lens="ext"><b>客户运营（External）</b><span>S2P · O2C · R2R，按 L1 / L2 拆解</span></button>
      <button id="lens-int" aria-pressed="false" data-lens="int"><b>项目实施（Internal）</b><span>SAP Activate 各阶段，按 L1 / L2 拆解</span></button>
    </div>
  </header>

  <div class="procs" id="procs" role="group" aria-label="流程"></div>
  <nav class="ribbon" id="ribbon" aria-label="L1 步骤"></nav>

  <div class="filters">
    <div class="grp"><span class="lbl">AI 类型</span><span id="types" class="grp"></span></div>
    <div class="grp"><span class="lbl">价值</span>
      <button class="fchip" id="imp-all" aria-pressed="true" data-imp="0">全部</button>
      <button class="fchip" id="imp-hi" aria-pressed="false" data-imp="3">仅高价值</button>
    </div>
    <div class="grp"><input id="q" type="search" placeholder="搜索痛点、团队、AI…" aria-label="搜索"></div>
    <div class="count" id="count"></div>
  </div>

  <main id="out"></main>

  <footer>
    讨论稿。价值评级是对效率和风控收益的定性判断，不是实测数据。“SAP 现有能力”仅示例说明 SAP 产品组合中已有类似功能；对客户引用前请核实当前可用性、授权和版本。
  </footer>
</div>

<script>

/* ===== UI ===== */
const TYPES = ["Generative","Predictive","Document AI","Matching","Anomaly","Agentic"];
const IMP = ["","较低","中等","高"];
const st = {lens:"ext", proc:"S2P", l1:-1, types:new Set(), imp:0, q:""};
try{ const s = JSON.parse(localStorage.getItem("sapai")||"{}"); if(s.lens && DATA[s.lens]) { st.lens=s.lens; st.proc=Object.keys(DATA[s.lens])[0]; if(s.proc && DATA[s.lens][s.proc]) st.proc=s.proc; } }catch(e){}
const save=()=>{try{localStorage.setItem("sapai",JSON.stringify({lens:st.lens,proc:st.proc}))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const personIcon='<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="currentColor"/><path d="M2 15c0-3.3 2.7-5 6-5s6 1.7 6 5" fill="currentColor"/></svg>';
const prefix = (lens,proc)=> lens==="ext"?proc:"ACT";

function match(r){
  if(st.types.size && !st.types.has(r[4])) return false;
  if(r[5] < st.imp) return false;
  if(st.q){ const q=st.q.toLowerCase(); if(!r.slice(0,5).concat(r[6]).join(" ").toLowerCase().includes(q)) return false; }
  return true;
}

function render(){
  const lensData = DATA[st.lens], p = lensData[st.proc];
  document.documentElement.style.setProperty("--accent", `var(${p.color})`);
  for(const b of document.querySelectorAll(".lens button")) b.setAttribute("aria-pressed", b.dataset.lens===st.lens);
  $("procs").innerHTML = Object.entries(lensData).map(([k,v])=>{
    const n=v.l1.reduce((a,l)=>a+l.l2.length,0);
    return `<button data-proc="${k}" aria-pressed="${k===st.proc}">${esc(v.name)}<small>${n} 个 L2</small></button>`}).join("");
  const pre = prefix(st.lens, st.proc);
  $("ribbon").innerHTML = p.l1.map((l,i)=>{
    const n=l.l2.filter(match).length;
    return `<button data-l1="${i}" aria-pressed="${st.l1===i}" title="${esc(l.desc)}"><span class="code">${pre}-${i+1}</span><span class="nm">${esc(l.name)}</span><span class="ct">显示 ${n} / ${l.l2.length}</span></button>`}).join("");
  $("types").innerHTML = TYPES.map(t=>`<button class="fchip" data-type="${t}" aria-pressed="${st.types.has(t)}">${t}</button>`).join("");
  for(const b of document.querySelectorAll("[data-imp]")) b.setAttribute("aria-pressed", +b.dataset.imp===st.imp);
  let total=0, shown=0, html="";
  p.l1.forEach((l,i)=>{
    total+=l.l2.length;
    if(st.l1>=0 && st.l1!==i) return;
    const rows=l.l2.map((r,j)=>[r,j]).filter(([r])=>match(r));
    shown+=rows.length;
    if(!rows.length) return;
    html+=`<section class="l1" id="l1-${i}"><div class="l1head"><span class="code">${pre}-${i+1}</span><h2>${esc(l.name)}</h2><p>${esc(l.desc)}</p></div>`;
    html+=rows.map(([r,j])=>`<article class="l2">
      <div class="who"><span class="code">${pre}-${i+1}.${j+1} · L2</span><h3>${esc(r[0])}</h3>
        <span class="team">${personIcon}${esc(r[1])}</span>
        <div class="meta"><span class="tag">${esc(r[4])}</span></div>
        <div class="impact" aria-label="价值 ${r[5]} / 3">${[1,2,3].map(k=>`<i class="${k<=r[5]?"on":""}"></i>`).join("")}<span>${IMP[r[5]]}价值</span></div>
      </div>
      <div class="pain"><span class="col-h">痛点</span><p>${esc(r[2])}</p></div>
      <div class="ai"><span class="col-h">AI 如何帮助</span><p>${esc(r[3])}</p>${r[6]?`<div class="sapref">SAP 现有能力：<b>${esc(r[6])}</b></div>`:""}</div>
    </article>`).join("");
    html+=`</section>`;
  });
  $("out").innerHTML = html || `<div class="empty">没有符合筛选条件的机会点。请清除部分筛选或搜索词。</div>`;
  $("count").textContent = `显示 ${shown} / ${total} 个 L2 ${st.lens==="ext"?"流程":"活动"}`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.lens){ st.lens=b.dataset.lens; st.proc=Object.keys(DATA[st.lens])[0]; st.l1=-1; save(); }
  else if(b.dataset.proc){ st.proc=b.dataset.proc; st.l1=-1; save(); }
  else if(b.dataset.l1!==undefined){ const i=+b.dataset.l1; st.l1 = st.l1===i?-1:i; }
  else if(b.dataset.type){ st.types.has(b.dataset.type)?st.types.delete(b.dataset.type):st.types.add(b.dataset.type); }
  else if(b.dataset.imp!==undefined){ st.imp=+b.dataset.imp; }
  else return;
  render();
});
$("q").addEventListener("input",e=>{st.q=e.target.value.trim(); render();});
render();
</script>
