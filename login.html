<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>登录 · SAP AI Opportunity Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--bg:#f3f5f6;--surface:#fff;--fg:#14202b;--muted:#5a6873;--line:#d5dce0;--accent:#0f7a6c;--err:#b4362f;--err-bg:#fbeceb;
  --f-display:"Bricolage Grotesque","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f161c;--surface:#17212a;--fg:#e4eaee;--muted:#93a2ad;--line:#2a3743;--accent:#3fc2ae;--err:#f08a82;--err-bg:#2c1c1d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);display:grid;place-items:center;padding-inline:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.2}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px;background:var(--accent);color:var(--bg);cursor:pointer;margin-top:4px}
.err{margin:0;padding:8px 12px;border-radius:8px;background:var(--err-bg);color:var(--err);font-size:14px}
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="eyebrow">内部材料 · 请登录</div>
  <h1>SAP AI Opportunity Map</h1>
  <!--MESSAGE-->
  <label for="username">用户名<input id="username" name="username" autocomplete="username" required autofocus></label>
  <label for="password">密码<input id="password" name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">登录</button>
</form>
</body>
</html>
